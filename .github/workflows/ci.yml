name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RabbitMqMessaging.slnx --configfile NuGet.Config
      - run: dotnet build RabbitMqMessaging.slnx --configuration Release --no-restore --warnaserror
      - run: dotnet test RabbitMqMessaging.slnx --configuration Release --no-build
